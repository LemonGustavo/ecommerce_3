services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://postgres:postgres@banco:5432/ecommerce?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  pgdata: